name: Validate analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m py_compile src/analyze.py

      - name: Run analysis pipeline
        run: python src/analyze.py

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: global-economic-insights-output
          path: |
            data/*.csv
            reports/figures/*.png
            reports/insights.md
